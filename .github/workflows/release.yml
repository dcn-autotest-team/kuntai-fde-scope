name: Release CI/CD

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches application versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          FRONTEND_VERSION="$(node -p "require('./frontend/package.json').version")"
          BACKEND_VERSION="$(python -c "import pathlib,re; text=pathlib.Path('backend/app/main.py').read_text(encoding='utf-8'); print(re.search(r'version=\"([^\"]+)\"', text).group(1))")"

          test "$RELEASE_TAG" != "$VERSION" || { echo "Release tag must start with v (for example v3.0.0)."; exit 1; }
          test "$VERSION" = "$FRONTEND_VERSION" || { echo "Tag $VERSION does not match frontend version $FRONTEND_VERSION."; exit 1; }
          test "$VERSION" = "$BACKEND_VERSION" || { echo "Tag $VERSION does not match backend version $BACKEND_VERSION."; exit 1; }

  backend-ci:
    name: Backend tests
    needs: validate-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests and enforce coverage
        run: python -m pytest tests -q --cov=app --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov
          if-no-files-found: warn
          retention-days: 14

  frontend-ci:
    name: Frontend tests and build
    needs: validate-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests and enforce coverage
        run: npm run test:coverage

      - name: Build production frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 14

  publish-assets:
    name: Publish release assets
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: release-assets/frontend

      - name: Package release assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          (cd release-assets/frontend && zip -r "../../kuntai-fde-frontend-${RELEASE_TAG}.zip" .)
          tar -czf "kuntai-fde-backend-${RELEASE_TAG}.tar.gz" -C backend app run.py requirements.txt
          sha256sum \
            "kuntai-fde-frontend-${RELEASE_TAG}.zip" \
            "kuntai-fde-backend-${RELEASE_TAG}.tar.gz" \
            > SHA256SUMS.txt

      - name: Attach assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "kuntai-fde-frontend-${RELEASE_TAG}.zip" \
            "kuntai-fde-backend-${RELEASE_TAG}.tar.gz" \
            SHA256SUMS.txt \
            --clobber
